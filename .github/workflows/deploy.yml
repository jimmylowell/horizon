name: Test and build

# The site is on Cloudflare Pages (project `horizon`) since 2026-11-06.
# This workflow only checks that a change installs, passes its tests and
# builds; a merge goes live by `wrangler pages deploy dist --project-name horizon --branch main`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
